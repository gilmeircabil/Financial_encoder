<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Acorn</title>
    <style>
      :root {
        --bg-boot: #f4f4f3;
        --text-boot: #2c2c30;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-boot: #090a0b;
          --text-boot: #f1f2f4;
        }
      }
      body {
        margin: 0;
        background: var(--bg, var(--bg-boot));
        color: var(--text, var(--text-boot));
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .boot-loader {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .boot-loader__card {
        padding: 24px 32px;
        border: 1px solid rgba(128, 128, 128, 0.2);
        border-radius: 12px;
        background: rgba(128, 128, 128, 0.08);
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader__card">
          Starting Acorn&hellip;
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
